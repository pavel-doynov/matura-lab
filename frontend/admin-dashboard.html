<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ Панел - Матура'25</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="assets/css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('authToken') || sessionStorage.getItem('authToken');
            const userStr = localStorage.getItem('user') || sessionStorage.getItem('user');
            
            // 1. Security Check
            if (!token) {
                window.location.href = 'login.html';
            } else if (userStr) {
                const user = JSON.parse(userStr);
                if (user.role !== 'admin') {
                    window.location.href = 'index.html';
                }
            }

            // 2. Logout Logic
            const logoutBtn = document.querySelector('.nav-action a');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', (e) => {
                    // The default href="login.html" will handle the redirect, 
                    // but we must clear storage first.
                    localStorage.removeItem('authToken');
                    localStorage.removeItem('user');
                    sessionStorage.removeItem('authToken');
                    sessionStorage.removeItem('user');
                });
            }

            // 3. Upload Questions Logic
            const addQuestionBtn = document.getElementById('add-question-btn');
            const fileInput = document.getElementById('question-file-input');
            const API_URL = (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') 
                ? 'http://127.0.0.1:5001' 
                : `http://${window.location.hostname}:5001`;

            if (addQuestionBtn && fileInput) {
                addQuestionBtn.addEventListener('click', () => {
                    fileInput.click();
                });

                fileInput.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (!file) return;

                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            const jsonData = JSON.parse(event.target.result);
                            
                            fetch(`${API_URL}/admin/upload-questions`, {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'Authorization': `Bearer ${token}`
                                },
                                body: JSON.stringify(jsonData)
                            })
                            .then(res => res.json())
                            .then(data => {
                                if (data.error) alert('Грешка: ' + data.error);
                                else alert(data.message);
                                fileInput.value = ''; // Reset
                            })
                            .catch(err => alert('Грешка при свързване със сървъра.'));
                        } catch (err) {
                            alert('Невалиден JSON файл!');
                        }
                    };
                    reader.readAsText(file);
                });
            }

            // 4. User Management Logic
            const usersTableBody = document.querySelector('.admin-table tbody');

            const fetchAndRenderUsers = async () => {
                if (!usersTableBody) return;
                usersTableBody.innerHTML = `<tr><td colspan="5">Зареждане...</td></tr>`;

                try {
                    const response = await fetch(`${API_URL}/admin/users`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error || 'Failed to fetch users');
                    }

                    const users = await response.json();
                    renderUsers(users);

                } catch (error) {
                    console.error('Error fetching users:', error);
                    usersTableBody.innerHTML = `<tr><td colspan="5">Грешка при зареждане на потребителите: ${error.message}</td></tr>`;
                }
            };

            const renderUsers = (users) => {
                usersTableBody.innerHTML = ''; // Clear loading/error message

                if (users.length === 0) {
                    usersTableBody.innerHTML = '<tr><td colspan="5">Няма намерени потребители.</td></tr>';
                    return;
                }

                users.forEach(user => {
                    const row = document.createElement('tr');
                    const uid = user.uid || '';
                    row.setAttribute('data-uid', uid);
                    row.innerHTML = `
                        <td>${uid ? uid.substring(0, 6) + '...' : 'Няма ID'}</td>
                        <td data-field="displayName">${user.displayName || 'N/A'}</td>
                        <td data-field="email">${user.email || 'N/A'}</td>
                        <td>${user.createdAt || 'N/A'}</td>
                        <td>
                            ${uid ?
                            `<a href="#" class="action-btn btn-edit" data-uid="${uid}">Редакция</a>
                            <a href="#" class="action-btn btn-delete" data-uid="${uid}">Изтрий</a>`
                            : 'Няма действия'}
                        </td>
                    `;
                    usersTableBody.appendChild(row);
                });
            };
            
            const handleDelete = async (uid, button) => {
                if (!uid || !confirm(`Сигурни ли сте, че искате да изтриете потребител с ID: ${uid}? Това действие е необратимо.`)) {
                    return;
                }

                try {
                    const response = await fetch(`${API_URL}/admin/users/${uid}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || 'Failed to delete user');
                    alert(data.message);
                    button.closest('tr').remove();
                } catch (error) {
                    console.error('Error deleting user:', error);
                    alert(`Грешка при изтриване: ${error.message}`);
                }
            };

            const handleEdit = async (uid, button) => {
                if (!uid) return;
                const row = button.closest('tr');
                const currentName = row.querySelector('[data-field="displayName"]').textContent;
                const newName = prompt('Въведете ново име:', currentName);

                if (newName === null || newName.trim() === '' || newName.trim() === currentName) {
                    return; // User cancelled, entered empty name, or made no change
                }

                try {
                    const response = await fetch(`${API_URL}/admin/users/${uid}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ displayName: newName.trim() })
                    });
                    const updatedUser = await response.json();
                    if (!response.ok) throw new Error(updatedUser.error || 'Failed to update user');
                    alert('Потребителят е обновен успешно.');
                    row.querySelector('[data-field="displayName"]').textContent = updatedUser.displayName;
                } catch (error) {
                    console.error('Error updating user:', error);
                    alert(`Грешка при обновяване: ${error.message}`);
                }
            };

            // Add single event listener to the table body
            usersTableBody.addEventListener('click', (e) => {
                e.preventDefault();
                const uid = e.target.dataset.uid;
                if (e.target.classList.contains('btn-delete')) handleDelete(uid, e.target);
                if (e.target.classList.contains('btn-edit')) handleEdit(uid, e.target);
            });

            // 5. Stats Logic
            const fetchAndRenderStats = async () => {
                const usersCountEl = document.getElementById('users-count');
                const questionsCountEl = document.getElementById('questions-count');

                if (!usersCountEl || !questionsCountEl) return;

                try {
                    const response = await fetch(`${API_URL}/admin/stats`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });

                    if (!response.ok) {
                        throw new Error('Failed to fetch stats');
                    }

                    const stats = await response.json();
                    
                    usersCountEl.textContent = stats.userCount.toLocaleString('bg-BG');
                    questionsCountEl.textContent = stats.questionCount.toLocaleString('bg-BG');

                } catch (error) {
                    console.error('Error fetching stats:', error);
                    usersCountEl.textContent = 'N/A';
                    questionsCountEl.textContent = 'N/A';
                }
            };

            // Initial fetches
            await fetchAndRenderStats();
            await fetchAndRenderUsers();
        });
    </script>
</head>
<body>
    <header class="main-header dark-nav">
        <nav class="navbar">
            <div class="nav-logo">
                <a href="index.html"><img src="assets/images/IMG_3386.png" alt="Матура'25" style="height: 40px;"></a>
                <span style="color: black; margin-left: 10px; font-weight: 600; opacity: 0.9; vertical-align: middle;">ADMIN</span>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html" target="_blank">Преглед на сайта</a></li>
            </ul>
            <div class="nav-action">
                <a href="login.html" class="btn btn-secondary">Изход</a>
            </div>
        </nav>
    </header>

    <div class="admin-container">
        <aside class="admin-sidebar">
            <ul class="admin-nav-list">
                <li class="admin-nav-item"><a href="#" class="admin-nav-link active">Табло</a></li>
                <li class="admin-nav-item"><a href="#" class="admin-nav-link">Потребители</a></li>
                <li class="admin-nav-item"><a href="#" class="admin-nav-link">Тестове</a></li>
                <li class="admin-nav-item"><a href="#" class="admin-nav-link">Материали</a></li>
                <li class="admin-nav-item"><a href="#" class="admin-nav-link">Настройки</a></li>
            </ul>
        </aside>

        <main class="admin-main">
            <!-- Stats Row -->
            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-title">Потребители</span>
                    <span class="stat-number" id="users-count">...</span>
                    <span style="color: #666; font-size: 0.85rem;">В базата данни</span>
                </div>
                <div class="stat-card">
                    <span class="stat-title">Решени тестове</span>
                    <span class="stat-number">...</span>
                    <span style="color: #4caf50; font-size: 0.85rem;">Предстои</span>
                </div>
                <div class="stat-card">
                    <span class="stat-title">Активни въпроси</span>
                    <span class="stat-number" id="questions-count">...</span>
                    <span style="color: #666; font-size: 0.85rem;">В базата данни</span>
                </div>
            </div>

            <!-- Recent Users Table -->
            <div class="admin-card">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h2 style="margin: 0; font-size: 1.25rem;">Последни регистрации</h2>
                    <a href="#" class="btn btn-secondary" style="font-size: 0.9rem; padding: 0.5rem 1rem;">Виж всички</a>
                </div>
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Име</th>
                            <th>Имейл</th>
                            <th>Дата</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- User rows will be dynamically inserted here -->
                        <tr><td colspan="5">Зареждане...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- Content Management Quick Actions -->
            <div class="admin-card">
                <h2 style="margin-top: 0; margin-bottom: 1.5rem; font-size: 1.25rem;">Управление на съдържанието</h2>
                <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                    <button id="add-question-btn" class="btn btn-primary">Добави нов въпрос</button>
                    <input type="file" id="question-file-input" accept=".json" style="display: none;">
                </div>
            </div>
        </main>
    </div>
</body>
</html>
